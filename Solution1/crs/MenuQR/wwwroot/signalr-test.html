<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SignalR test</title>
</head>
<body style="font-family:sans-serif;max-width:700px;margin:2rem auto">
    <h3>Admin live orders test</h3>
    <textarea id="token" rows="4" style="width:100%" placeholder="Paste your admin token here"></textarea>
    <button id="connect">Connect</button>
    <pre id="log" style="background:#eee;padding:1rem;min-height:200px;white-space:pre-wrap"></pre>

    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
    <script>
    const log = (m) => document.getElementById("log").textContent += m + "\n\n";

    document.getElementById("connect").onclick = async () => {
      const token = document.getElementById("token").value.trim();
      const conn = new signalR.HubConnectionBuilder()
        .withUrl("/hubs/orders", { accessTokenFactory: () => token })
        .withAutomaticReconnect()
        .build();

      conn.on("OrderCreated", o => log("NEW ORDER: " + JSON.stringify(o)));
      conn.on("OrderUpdated", o => log("ORDER UPDATED: " + JSON.stringify(o)));

      try { await conn.start(); log("Connected. Waiting for orders..."); }
      catch (e) { log("Failed: " + e); }
    };
    </script>
</body>
</html>
